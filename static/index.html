<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux AI Agent Console</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; flex-direction: column; height: 100vh; }
        h2 { margin: 0 0 12px 0; font-size: 1.25rem; color: #38bdf8; text-align: center; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; padding: 12px; background: #1e293b; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .user { background: #0284c7; color: #ffffff; align-self: flex-end; }
        .bot { background: #334155; color: #f8fafc; align-self: flex-start; }
        .code-box { background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 0.85rem; color: #4ade80; margin-top: 6px; white-space: pre-wrap; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #ffffff; font-size: 1rem; outline: none; }
        button { padding: 12px 20px; background: #0284c7; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #475569; }
    </style>
</head>
<body>
    <h2>Termux AI Agent Console</h2>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question or give a math problem..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const chatBox = document.getElementById('chat-box');
            const text = input.value.trim();
            if (!text) return;

            // Display user message
            chatBox.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
            input.value = '';
            input.disabled = true;
            btn.disabled = true;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'sk-termux-agent-secret-key-2026'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();
                let botContent = `<div class="msg bot"><strong>AI:</strong> ${escapeHtml(data.reply || data.detail)}`;
                if (data.execution_output) {
                    botContent += `<div class="code-box"><strong>[Local Sandbox Execution Output]</strong>\n${escapeHtml(data.execution_output)}</div>`;
                }
                botContent += `</div>`;
                chatBox.innerHTML += botContent;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg bot" style="color:#f87171;">Failed to connect to backend server.</div>`;
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
