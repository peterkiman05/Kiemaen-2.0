<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Integrated HUD</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --surface-hover: #1d2844;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-glow: #38bdf8;
            --bubble-user: #1e293b;
            --bubble-ai: #131b2e;
            --border-color: rgba(56, 189, 248, 0.2);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(19, 27, 46, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }
        .gem-selector-pill {
            display: flex;
            align-items: center;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            gap: 8px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .message-row.user { align-self: flex-end; }
        .message-row.ai { align-self: flex-start; }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }
        .user .message-bubble {
            background: var(--bubble-user);
            border-top-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ai .message-bubble {
            background: var(--bubble-ai);
            border-top-left-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }
        .input-dock {
            padding: 12px 16px 20px 16px;
            background: linear-gradient(to top, var(--bg-color) 85%, rgba(11, 15, 25, 0));
        }
        .input-container {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 8px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            gap: 8px;
        }
        .input-container textarea, .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 8px;
            outline: none;
            resize: none;
            max-height: 120px;
        }
        .send-btn {
            background: var(--accent-glow);
            color: #0b0f19;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div class="hud-header">
        <div style="font-weight: bold; letter-spacing: 1px; color: #38bdf8;">GEMINI HUD</div>
        <div class="gem-selector-pill">
            <span>GEM: Tactical HUD</span>
        </div>
    </div>

    <div id="chat-container">
        <div class="message-row ai">
            <div class="message-bubble">System online. Ready for directives.</div>
        </div>
    </div>

    <div class="input-dock">
        <div class="input-container">
            <button style="background:none; border:none; color:#9ca3af; font-size:20px; cursor:pointer;">+</button>
            <textarea id="user-input" rows="1" placeholder="Ask Gemini..."></textarea>
            <button class="send-btn" id="send-btn">&#8593;</button>
        </div>
    </div>
</body>
</html>
